intake_version: "1.0"
project_id: intake-demo-weather
display_name: Disposable weather intake demonstration
description: >-
  Exercise project intake with synthetic weather data only. This description
  names the intended work; simulation receipts do not create or validate CSVs.
repository:
  path: ./runtime/intake-demo-weather
  base_branch: main
policy:
  max_workers: 2
tasks:
  - task_id: observations
    title: Describe synthetic observations
    description: Define a deterministic synthetic temperature table contract.
    acceptance_criteria:
      - Table columns and row count are specified for later real validation.
    estimate_minutes: 4
    depends_on: []
    simulation:
      duration_seconds: 0.1
      output: Synthetic observation-contract receipt; no CSV was generated.
  - task_id: averages
    title: Describe average calculation
    description: State how daily means would be calculated from observations.
    acceptance_criteria:
      - Expected aggregation rule is specified.
    estimate_minutes: 3
    depends_on: [observations]
    simulation:
      duration_seconds: 0.1
      output: Synthetic average-contract receipt; no calculation was executed.
  - task_id: chart
    title: Describe chart presentation
    description: State the labels and axes for a future temperature chart.
    acceptance_criteria:
      - Axis labels and chart title are specified.
    estimate_minutes: 2
    depends_on: [observations]
    simulation:
      duration_seconds: 0.1
      output: Synthetic chart-contract receipt; no image was generated.
